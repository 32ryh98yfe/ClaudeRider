name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.22.0, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      - run: pnpm check:frozen
      - run: pnpm check:deps
      - run: pnpm typecheck
      - run: pnpm lint
      # The all-track simulation tests discover cached roster assets at import
      # time. Bake first so a fresh runner exercises those races as well.
      - run: pnpm bake
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
